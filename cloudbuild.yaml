# AKVEZ — pipeline de build y despliegue en Google Cloud Run.
#
# Tres pasos: construir la imagen, publicarla en Artifact Registry y desplegar
# una revisión nueva del servicio.
#
# Ejecución manual:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_PROJECT_ID=<proyecto>,_REGION=<región>
#
# Todo valor específico del entorno vive en `substitutions`; este fichero no
# contiene credenciales. Las claves se resuelven en Secret Manager en el
# momento del despliegue (paso `deploy`), no durante el build: la imagen es
# idéntica en cualquier entorno y no lleva secretos dentro.

substitutions:
  # Servicio y ubicación.
  _SERVICE_NAME: akvez
  _REGION: us-central1

  # Repositorio de Artifact Registry. Debe existir antes del primer build
  # (ver el procedimiento en docs/hackathon/H-03A — Cloud Deployment Audit.md).
  _REPOSITORY: akvez
  _IMAGE_NAME: akvez

  # Nombres de los secretos en Secret Manager. Se mantienen como sustituciones
  # para que un cambio de nomenclatura no exija tocar el paso de despliegue.
  _GEMINI_SECRET: gemini-api-key
  _PLACES_SECRET: google-places-api-key

steps:
  # -------------------------------------------------------------------------
  # 1 — Construir la imagen.
  #
  # Se etiqueta con $BUILD_ID además de `latest`: $BUILD_ID está disponible
  # tanto en builds manuales como en los disparados por trigger, mientras que
  # $SHORT_SHA solo existe en estos últimos. La etiqueta inmutable es la que
  # se despliega; `latest` queda como referencia legible.
  # -------------------------------------------------------------------------
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest
      - .

  # -------------------------------------------------------------------------
  # 2 — Publicar ambas etiquetas en Artifact Registry.
  # -------------------------------------------------------------------------
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}

  # -------------------------------------------------------------------------
  # 3 — Desplegar la revisión.
  #
  # `--set-secrets` monta cada secreto como variable de entorno del proceso.
  # El backend las lee a través de `server/shared/config/env.ts`, única
  # frontera con `process.env` (ADR-04 §11): no hay cambio de código asociado
  # a esta forma de inyección.
  #
  # PORT no se declara: Cloud Run lo inyecta y prohíbe fijarlo por
  # configuración del servicio.
  # -------------------------------------------------------------------------
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --set-env-vars=NODE_ENV=production
      - --set-secrets=GEMINI_API_KEY=${_GEMINI_SECRET}:latest,GOOGLE_PLACES_API_KEY=${_PLACES_SECRET}:latest
      - --cpu=1
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=3
      - --timeout=300
      # La demo necesita una URL pública. El servicio no tiene autenticación
      # propia: ver el riesgo R-3 del documento de despliegue.
      - --allow-unauthenticated

# Registra la imagen como artefacto del build.
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest

options:
  # Sin bucket de logs propio, Cloud Build exige declarar el destino.
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

# El build instala dependencias y compila frontend y backend.
timeout: 1200s
